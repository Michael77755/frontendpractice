<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>C++ and JS Test</title>
  <link rel ="stylesheet" href="style.css">
</head>
<body>
  <h1>Michael's Calculator</h1>

  <div class="card">
  <h3>Instructions</h3>
  <button id="btn">Click for Instructions</button>
  <div id="output" class="result-box">Waiting for instructions...</div>
</div>

<div class="card">
  <h3>Greeting</h3>
  <div class="form-row">
    <input type="text" id="name" placeholder="Enter your name" />
    <button id="sendGreetBtn">Send</button>
  </div>
  <div id="greetOutput" class="result-box">No greeting yet</div>
</div>

<div class="card">
  <h3>Calculator</h3>
  <div class="form-row">
    <input type="number" id="numberone" placeholder="Num 1" />
    <input type="text" id="op" placeholder="Op (+, -, *, /)" style="max-width: 90px; text-align: center;" />
    <input type="number" id="numbertwo" placeholder="Num 2" />
  </div>
  <button id="sendCalcBtn" style="width: 100%;">Calculate</button>
  <div id="calculation" class="result-box">Result will appear here</div>
</div>

  <script>
    // Part 1: GET
    document.getElementById('btn').addEventListener('click', async () => {
      const response = await fetch('http://localhost:18080/api/message');
      const data = await response.json();
      document.getElementById('output').innerText = data.message;
    });

    // Part 2: POST
    document.getElementById('sendGreetBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value;

      const response = await fetch('http://localhost:18080/api/greet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });

      const data = await response.json();
      document.getElementById('greetOutput').innerText = data.greeting;
    });

    document.getElementById('sendCalcBtn').addEventListener('click', async () => {
      const numberone = document.getElementById('numberone').value;
      const op = document.getElementById('op').value;
      const numbertwo = document.getElementById('numbertwo').value;

      const response = await fetch('http://localhost:18080/api/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numberone : parseInt(numberone, 10), op: op, numbertwo : parseInt(numbertwo, 10) })
      });

      const data = await response.json();
      document.getElementById('calculation').innerText = data.calculation || data.error;
    });
  </script>
</body>
</html>
